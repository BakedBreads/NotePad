<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Notepad · Live</title>
    <!-- Firebase SDKs (compat version for easier use) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.10);
            padding: 30px 28px;
            transition: box-shadow 0.2s;
        }
        h1 {
            font-weight: 600;
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }
        .subtitle {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            background: #f3f4f6;
            padding: 4px 14px;
            border-radius: 30px;
            color: #374151;
        }
        .status .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .status .dot.synced {
            background: #22c55e;
        }
        .status .dot.saving {
            background: #f59e0b;
            animation: pulse 1s infinite;
        }
        .status .dot.error {
            background: #ef4444;
        }
        @keyframes pulse {
            0% { opacity: 0.4; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.1); }
            100% { opacity: 0.4; transform: scale(0.9); }
        }
        textarea {
            width: 100%;
            min-height: 380px;
            padding: 18px 20px;
            font-size: 16px;
            line-height: 1.7;
            border: 2px solid #e5e7eb;
            border-radius: 16px;
            resize: vertical;
            font-family: inherit;
            transition: border 0.2s, box-shadow 0.2s;
            background: #fafbfc;
            color: #1f2937;
        }
        textarea:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99,102,241,0.15);
        }
        .actions {
            margin-top: 18px;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            flex-wrap: wrap;
        }
        .actions button {
            padding: 10px 22px;
            border: none;
            border-radius: 40px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .actions button:active {
            transform: scale(0.96);
        }
        .btn-clear {
            background: #fee2e2;
            color: #b91c1c;
        }
        .btn-clear:hover {
            background: #fecaca;
        }
        .btn-copy {
            background: #e0e7ff;
            color: #3730a3;
        }
        .btn-copy:hover {
            background: #c7d2fe;
        }
        .footer {
            margin-top: 20px;
            font-size: 13px;
            color: #9ca3af;
            text-align: center;
            border-top: 1px solid #f3f4f6;
            padding-top: 16px;
        }
        .footer a {
            color: #6366f1;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        .url-box {
            margin-top: 12px;
            padding: 10px 14px;
            background: #f8fafc;
            border: 1px dashed #d1d5db;
            border-radius: 12px;
            font-size: 13px;
            color: #4b5563;
            word-break: break-all;
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: space-between;
        }
        .url-box button {
            background: #6366f1;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }
        .url-box button:hover {
            background: #4f46e5;
        }
        @media (max-width: 500px) {
            .container { padding: 20px 16px; }
            textarea { min-height: 280px; }
            .url-box { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 Shared Notepad</h1>
    <div class="subtitle">
        <span>Write anything – it syncs live with everyone.</span>
        <span class="status">
            <span class="dot synced" id="statusDot"></span>
            <span id="statusLabel">Synced</span>
        </span>
    </div>

    <textarea id="notepad" placeholder="Start typing... your text will appear for everyone who opens this page."></textarea>

    <div class="actions">
        <button class="btn-copy" id="copyBtn">📋 Copy text</button>
        <button class="btn-clear" id="clearBtn">🗑️ Clear</button>
    </div>

    <div class="url-box">
        <span style="flex:1; overflow:hidden; text-overflow:ellipsis;" id="pageUrl">Loading URL...</span>
        <button id="copyUrlBtn">📋 Copy link</button>
    </div>

    <div class="footer">
        🔗 Share this link – everyone sees the same text in real time!
    </div>
</div>

<script>
    // ─────────────────────────────────────────────────────────────
    //  🔥 YOUR FIREBASE CONFIG (already inserted!)
    // ─────────────────────────────────────────────────────────────
    const firebaseConfig = {
        apiKey: "AIzaSyAmRrYLyWRRpquB00G_1k2GnRUNgWWWB04",
        authDomain: "my-shared-notepad-270c7.firebaseapp.com",
        projectId: "my-shared-notepad-270c7",
        storageBucket: "my-shared-notepad-270c7.firebasestorage.app",
        messagingSenderId: "1029239847082",
        appId: "1:1029239847082:web:ea5aed8950140dd808b8d3",
        measurementId: "G-791T68MJY7"
    };

    // ─────────────────────────────────────────────────────────────
    //  ⚙️ INIT FIREBASE
    // ─────────────────────────────────────────────────────────────
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const dbRef = database.ref('notepad/text');   // path in the database

    // ─────────────────────────────────────────────────────────────
    //  🧩 DOM refs
    // ─────────────────────────────────────────────────────────────
    const textarea = document.getElementById('notepad');
    const statusDot = document.getElementById('statusDot');
    const statusLabel = document.getElementById('statusLabel');
    const copyBtn = document.getElementById('copyBtn');
    const clearBtn = document.getElementById('clearBtn');
    const copyUrlBtn = document.getElementById('copyUrlBtn');
    const pageUrl = document.getElementById('pageUrl');

    // ─────────────────────────────────────────────────────────────
    //  📥 LOAD from Firebase on page load
    // ─────────────────────────────────────────────────────────────
    dbRef.on('value', (snapshot) => {
        const val = snapshot.val();
        const text = (val !== null && val !== undefined) ? val : '';
        if (textarea.value !== text) {
            textarea.value = text;
        }
        setStatus('synced', 'Synced');
    }, (error) => {
        console.error('Firebase read error:', error);
        setStatus('error', '⚠️ Error loading');
    });

    // ─────────────────────────────────────────────────────────────
    //  📤 SAVE on every input (debounced)
    // ─────────────────────────────────────────────────────────────
    let saveTimeout = null;
    textarea.addEventListener('input', () => {
        setStatus('saving', 'Saving…');

        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => {
            const text = textarea.value;
            dbRef.set(text)
                .then(() => {
                    setStatus('synced', 'Synced');
                })
                .catch((err) => {
                    console.error('Save error:', err);
                    setStatus('error', '❌ Save failed');
                });
        }, 400);
    });

    // ─────────────────────────────────────────────────────────────
    //  🧹 Clear button
    // ─────────────────────────────────────────────────────────────
    clearBtn.addEventListener('click', () => {
        if (textarea.value === '') return;
        if (confirm('Clear the notepad for everyone?')) {
            textarea.value = '';
            dbRef.set('')
                .then(() => setStatus('synced', 'Cleared'))
                .catch(err => console.error(err));
        }
    });

    // ─────────────────────────────────────────────────────────────
    //  📋 Copy text button
    // ─────────────────────────────────────────────────────────────
    copyBtn.addEventListener('click', async () => {
        try {
            await navigator.clipboard.writeText(textarea.value);
            copyBtn.innerHTML = '✅ Copied!';
            setTimeout(() => { copyBtn.innerHTML = '📋 Copy text'; }, 2000);
        } catch (_) {
            textarea.select();
            document.execCommand('copy');
            copyBtn.innerHTML = '✅ Copied!';
            setTimeout(() => { copyBtn.innerHTML = '📋 Copy text'; }, 2000);
        }
    });

    // ─────────────────────────────────────────────────────────────
    //  🔗 Show and copy page URL
    // ─────────────────────────────────────────────────────────────
    pageUrl.textContent = window.location.href;

    copyUrlBtn.addEventListener('click', async () => {
        try {
            await navigator.clipboard.writeText(window.location.href);
            copyUrlBtn.textContent = '✅ Copied!';
            setTimeout(() => { copyUrlBtn.innerHTML = '📋 Copy link'; }, 2000);
        } catch (_) {
            // fallback
            const input = document.createElement('input');
            input.value = window.location.href;
            document.body.appendChild(input);
            input.select();
            document.execCommand('copy');
            document.body.removeChild(input);
            copyUrlBtn.textContent = '✅ Copied!';
            setTimeout(() => { copyUrlBtn.innerHTML = '📋 Copy link'; }, 2000);
        }
    });

    // ─────────────────────────────────────────────────────────────
    //  🎨 Status helper
    // ─────────────────────────────────────────────────────────────
    function setStatus(type, label) {
        statusDot.className = 'dot';
        if (type === 'synced') statusDot.classList.add('synced');
        else if (type === 'saving') statusDot.classList.add('saving');
        else if (type === 'error') {
            statusDot.classList.add('error');
        }
        statusLabel.textContent = label;
    }

    // ─────────────────────────────────────────────────────────────
    //  ⚡ Keyboard shortcut: Ctrl+Shift+Delete to clear
    // ─────────────────────────────────────────────────────────────
    document.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.shiftKey && e.key === 'Delete') {
            e.preventDefault();
            clearBtn.click();
        }
    });

    console.log('📝 Shared Notepad ready! Share this URL with friends.');
    console.log('🔗', window.location.href);
</script>

</body>
</html>
