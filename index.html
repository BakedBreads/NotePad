<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WhatsApp Web · Chat</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ─── Reset & Base ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --bg-primary: #0b141a;
            --bg-chat: #0b141a;
            --bg-header: #1f2c33;
            --bg-input: #2a3942;
            --bg-message-sent: #005c4b;
            --bg-message-received: #1f2c33;
            --text-primary: #e9edef;
            --text-secondary: #aebac1;
            --text-message-sent: #e9edef;
            --text-message-received: #e9edef;
            --border-color: #2a3942;
            --shadow: 0 2px 8px rgba(0,0,0,0.3);
            --radius: 8px;
            --green-accent: #00a884;
            --delete-hover: #ff4444;
        }
        
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin: 0;
        }
        
        .app-container {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            max-height: 850px;
            background: var(--bg-chat);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }
        
        @media (min-width: 430px) {
            .app-container {
                border-radius: 16px;
                height: 90vh;
            }
        }
        
        /* ─── Header ─── */
        .chat-header {
            background: var(--bg-header);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        .chat-header .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--green-accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 18px;
            color: white;
            flex-shrink: 0;
        }
        
        .chat-header .chat-info {
            flex: 1;
            min-width: 0;
        }
        
        .chat-header .chat-info h2 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .chat-header .chat-info .status {
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .chat-header .chat-info .status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green-accent);
            display: inline-block;
        }
        
        .chat-header .chat-info .status .dot.offline {
            background: #6b7280;
        }
        
        .chat-header .header-actions {
            display: flex;
            gap: 8px;
        }
        
        .chat-header .header-actions button {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .chat-header .header-actions button:hover {
            background: rgba(255,255,255,0.05);
        }
        
        /* ─── Messages Area ─── */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            background-image: url('data:image/svg+xml,%3Csvg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"%3E%3Cg fill="none" fill-rule="evenodd"%3E%3Cg fill="%23ffffff" fill-opacity="0.03"%3E%3Cpath d="M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z"/%3E%3C/g%3E%3C/g%3E%3C/svg%3E');
        }
        
        .messages-container::-webkit-scrollbar {
            width: 4px;
        }
        
        .messages-container::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .messages-container::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 10px;
        }
        
        /* ─── Messages ─── */
        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            animation: slideUp 0.2s ease;
            position: relative;
            transition: opacity 0.3s ease;
        }
        
        .message-wrapper.deleting {
            opacity: 0;
            transform: scale(0.9);
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message-wrapper.sent {
            align-self: flex-end;
            align-items: flex-end;
        }
        
        .message-wrapper.received {
            align-self: flex-start;
            align-items: flex-start;
        }
        
        .message-wrapper:hover .delete-btn {
            display: flex;
        }
        
        .message-bubble {
            padding: 8px 12px;
            border-radius: var(--radius);
            font-size: 14.2px;
            line-height: 1.5;
            word-wrap: break-word;
            position: relative;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .message-wrapper.sent .message-bubble {
            background: var(--bg-message-sent);
            color: var(--text-message-sent);
            border-top-right-radius: 2px;
        }
        
        .message-wrapper.received .message-bubble {
            background: var(--bg-message-received);
            color: var(--text-message-received);
            border-top-left-radius: 2px;
        }
        
        .message-text {
            flex: 1;
        }
        
        .delete-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 14px;
            padding: 2px 6px;
            border-radius: 4px;
            display: none;
            transition: all 0.2s;
        }
        
        .delete-btn:hover {
            color: var(--delete-hover);
            background: rgba(255,68,68,0.1);
        }
        
        .delete-btn.visible {
            display: flex;
        }
        
        .message-time {
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: 2px;
            padding: 0 4px;
            opacity: 0.8;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .message-wrapper.sent .message-time {
            justify-content: flex-end;
        }
        
        .message-wrapper.sent .message-time i {
            font-size: 12px;
            color: var(--green-accent);
        }
        
        /* ─── System Messages ─── */
        .system-message {
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
            padding: 6px 0;
            opacity: 0.7;
        }
        
        /* ─── Typing Indicator ─── */
        .typing-indicator {
            display: none;
            padding: 8px 12px;
            align-self: flex-start;
            color: var(--text-secondary);
            font-size: 13px;
            gap: 6px;
            align-items: center;
        }
        
        .typing-indicator .dots {
            display: flex;
            gap: 4px;
        }
        
        .typing-indicator .dots span {
            width: 6px;
            height: 6px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: typingDot 1.4s infinite;
        }
        
        .typing-indicator .dots span:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing-indicator .dots span:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes typingDot {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
            30% { transform: translateY(-6px); opacity: 1; }
        }
        
        /* ─── Input Area ─── */
        .input-area {
            background: var(--bg-header);
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        
        .input-area .input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            background: var(--bg-input);
            border-radius: 20px;
            padding: 0 12px;
            transition: border 0.2s;
        }
        
        .input-area .input-wrapper:focus-within {
            outline: 2px solid var(--green-accent);
        }
        
        .input-area input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px 0;
            color: var(--text-primary);
            font-size: 15px;
            outline: none;
            min-width: 0;
        }
        
        .input-area input::placeholder {
            color: var(--text-secondary);
        }
        
        .input-area .emoji-btn,
        .input-area .attach-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            padding: 6px 4px;
            cursor: pointer;
            transition: color 0.2s;
        }
        
        .input-area .emoji-btn:hover,
        .input-area .attach-btn:hover {
            color: var(--text-primary);
        }
        
        .input-area .send-btn {
            background: var(--green-accent);
            border: none;
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .input-area .send-btn:hover {
            background: #008f72;
        }
        
        .input-area .send-btn:active {
            transform: scale(0.92);
        }
        
        .input-area .send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        
        /* ─── Emoji Picker ─── */
        .emoji-picker {
            display: none;
            background: var(--bg-header);
            padding: 8px;
            border-top: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 4px;
            max-height: 150px;
            overflow-y: auto;
        }
        
        .emoji-picker.active {
            display: flex;
        }
        
        .emoji-picker span {
            font-size: 24px;
            padding: 4px 6px;
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.2s;
        }
        
        .emoji-picker span:hover {
            background: var(--bg-input);
        }
        
        /* ─── Scroll to bottom ─── */
        .scroll-to-bottom {
            position: absolute;
            bottom: 80px;
            right: 20px;
            background: var(--bg-input);
            color: var(--text-primary);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            font-size: 16px;
            z-index: 5;
            transition: transform 0.2s;
        }
        
        .scroll-to-bottom:hover {
            transform: scale(1.05);
        }
        
        .scroll-to-bottom.visible {
            display: flex;
        }
        
        /* ─── Responsive ─── */
        @media (max-width: 430px) {
            .app-container {
                max-height: none;
                border-radius: 0;
            }
        }
        
        @media (min-width: 768px) {
            .delete-btn {
                display: flex !important;
                opacity: 0.3;
            }
            
            .delete-btn:hover {
                opacity: 1;
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- ─── Header ─── -->
    <header class="chat-header">
        <div class="avatar">G</div>
        <div class="chat-info">
            <h2>Group Chat</h2>
            <div class="status">
                <span class="dot" id="onlineDot"></span>
                <span id="onlineStatus">Connecting...</span>
            </div>
        </div>
        <div class="header-actions">
            <button id="themeToggle" title="Toggle theme">
                <i class="fas fa-moon"></i>
            </button>
            <button id="clearChatBtn" title="Clear all messages">
                <i class="fas fa-trash"></i>
            </button>
        </div>
    </header>

    <!-- ─── Messages ─── -->
    <div class="messages-container" id="messagesContainer">
        <div class="system-message">✨ Welcome to the group chat!</div>
        <div class="typing-indicator" id="typingIndicator">
            <span>Someone is typing</span>
            <div class="dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </div>

    <!-- ─── Emoji Picker ─── -->
    <div class="emoji-picker" id="emojiPicker">
        <span>😀</span><span>😂</span><span>🥰</span><span>😍</span><span>😘</span>
        <span>🤔</span><span>😎</span><span>🥳</span><span>😭</span><span>😡</span>
        <span>👍</span><span>👎</span><span>❤️</span><span>🔥</span><span>💀</span>
        <span>🎉</span><span>✨</span><span>💯</span><span>🙏</span><span>🤝</span>
        <span>👋</span><span>😊</span><span>🥺</span><span>😅</span><span>🤣</span>
        <span>💪</span><span>👀</span><span>🎶</span><span>⭐</span><span>🌈</span>
    </div>

    <!-- ─── Input Area ─── -->
    <div class="input-area">
        <button class="emoji-btn" id="emojiBtn"><i class="far fa-smile"></i></button>
        <div class="input-wrapper">
            <input type="text" id="messageInput" placeholder="Type a message..." maxlength="500" autocomplete="off">
        </div>
        <button class="send-btn" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
    </div>

    <!-- ─── Scroll to bottom ─── -->
    <button class="scroll-to-bottom" id="scrollToBottom">
        <i class="fas fa-chevron-down"></i>
    </button>
</div>

<script>
// ─────────────────────────────────────────────────────────────
//  🔥 FIREBASE CONFIG (YOURS)
// ─────────────────────────────────────────────────────────────
const firebaseConfig = {
    apiKey: "AIzaSyAmRrYLyWRRpquB00G_1k2GnRUNgWWWB04",
    authDomain: "my-shared-notepad-270c7.firebaseapp.com",
    projectId: "my-shared-notepad-270c7",
    storageBucket: "my-shared-notepad-270c7.firebasestorage.app",
    messagingSenderId: "1029239847082",
    appId: "1:1029239847082:web:ea5aed8950140dd808b8d3",
    measurementId: "G-791T68MJY7"
};

// ─────────────────────────────────────────────────────────────
//  ⚙️ INIT FIREBASE
// ─────────────────────────────────────────────────────────────
firebase.initializeApp(firebaseConfig);
const database = firebase.database();
const messagesRef = database.ref('whatsapp/messages');
const typingRef = database.ref('whatsapp/typing');

// ─────────────────────────────────────────────────────────────
//  🧩 DOM REFS
// ─────────────────────────────────────────────────────────────
const messagesContainer = document.getElementById('messagesContainer');
const messageInput = document.getElementById('messageInput');
const sendBtn = document.getElementById('sendBtn');
const emojiBtn = document.getElementById('emojiBtn');
const emojiPicker = document.getElementById('emojiPicker');
const scrollToBottomBtn = document.getElementById('scrollToBottom');
const typingIndicator = document.getElementById('typingIndicator');
const onlineDot = document.getElementById('onlineDot');
const onlineStatus = document.getElementById('onlineStatus');
const clearChatBtn = document.getElementById('clearChatBtn');
const themeToggle = document.getElementById('themeToggle');

// ─────────────────────────────────────────────────────────────
//  🎨 THEME TOGGLE
// ─────────────────────────────────────────────────────────────
let isDark = true;

themeToggle.addEventListener('click', () => {
    isDark = !isDark;
    const root = document.documentElement;
    if (isDark) {
        root.style.setProperty('--bg-primary', '#0b141a');
        root.style.setProperty('--bg-chat', '#0b141a');
        root.style.setProperty('--bg-header', '#1f2c33');
        root.style.setProperty('--bg-input', '#2a3942');
        root.style.setProperty('--bg-message-sent', '#005c4b');
        root.style.setProperty('--bg-message-received', '#1f2c33');
        root.style.setProperty('--text-primary', '#e9edef');
        root.style.setProperty('--text-secondary', '#aebac1');
        root.style.setProperty('--border-color', '#2a3942');
        themeToggle.innerHTML = '<i class="fas fa-moon"></i>';
    } else {
        root.style.setProperty('--bg-primary', '#ece5dd');
        root.style.setProperty('--bg-chat', '#ece5dd');
        root.style.setProperty('--bg-header', '#075e54');
        root.style.setProperty('--bg-input', '#f0f0f0');
        root.style.setProperty('--bg-message-sent', '#dcf8c6');
        root.style.setProperty('--bg-message-received', '#ffffff');
        root.style.setProperty('--text-primary', '#1a1a1a');
        root.style.setProperty('--text-secondary', '#4a4a4a');
        root.style.setProperty('--border-color', '#d1d1d1');
        themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
    }
});

// ─────────────────────────────────────────────────────────────
//  📨 LOAD MESSAGES FROM FIREBASE
// ─────────────────────────────────────────────────────────────
let messageCount = 0;

messagesRef.limitToLast(50).on('child_added', (snapshot) => {
    const msg = snapshot.val();
    const key = snapshot.key;
    addMessageToUI(msg, key);
    scrollToBottom();
});

messagesRef.on('child_removed', (snapshot) => {
    const key = snapshot.key;
    const messageElement = document.querySelector(`[data-key="${key}"]`);
    if (messageElement) {
        messageElement.classList.add('deleting');
        setTimeout(() => {
            messageElement.remove();
        }, 300);
    }
    updateMessageCount();
});

messagesRef.on('value', (snapshot) => {
    const msgs = snapshot.val();
    if (msgs) {
        messageCount = Object.keys(msgs).length;
    } else {
        messageCount = 0;
    }
    updateOnlineStatus();
});

// ─────────────────────────────────────────────────────────────
//  👤 TYPING INDICATOR
// ─────────────────────────────────────────────────────────────
let typingTimeout = null;

typingRef.on('value', (snapshot) => {
    const isTyping = snapshot.val();
    if (isTyping) {
        typingIndicator.style.display = 'flex';
        onlineStatus.textContent = 'typing...';
        onlineDot.className = 'dot';
    } else {
        typingIndicator.style.display = 'none';
        onlineStatus.textContent = 'online';
        onlineDot.className = 'dot';
    }
});

function setTyping(isTyping) {
    typingRef.set(isTyping);
    if (isTyping) {
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => {
            typingRef.set(false);
        }, 2000);
    }
}

// ─────────────────────────────────────────────────────────────
//  ✉️ SEND MESSAGE
// ─────────────────────────────────────────────────────────────
function sendMessage() {
    const text = messageInput.value.trim();
    if (!text) return;

    const message = {
        text: text,
        timestamp: firebase.database.ServerValue.TIMESTAMP,
        sender: 'You'
    };

    messagesRef.push(message);
    messageInput.value = '';
    sendBtn.disabled = true;
    typingRef.set(false);
    clearTimeout(typingTimeout);

    setTimeout(() => {
        sendBtn.disabled = false;
    }, 300);

    scrollToBottom();
}

// ─────────────────────────────────────────────────────────────
//  🗑️ DELETE SINGLE MESSAGE
// ─────────────────────────────────────────────────────────────
function deleteMessage(key) {
    if (confirm('Delete this message?')) {
        messagesRef.child(key).remove()
            .then(() => {
                console.log('Message deleted:', key);
            })
            .catch((error) => {
                console.error('Error deleting:', error);
                alert('Failed to delete message');
            });
    }
}

// ─────────────────────────────────────────────────────────────
//  📨 ADD MESSAGE TO UI
// ─────────────────────────────────────────────────────────────
function addMessageToUI(msg, key) {
    const wrapper = document.createElement('div');
    wrapper.className = 'message-wrapper sent';
    wrapper.dataset.key = key;

    const bubble = document.createElement('div');
    bubble.className = 'message-bubble';

    const textSpan = document.createElement('span');
    textSpan.className = 'message-text';
    textSpan.textContent = msg.text;

    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'delete-btn';
    deleteBtn.innerHTML = '<i class="fas fa-trash"></i>';
    deleteBtn.title = 'Delete message';
    deleteBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        deleteMessage(key);
    });

    bubble.appendChild(textSpan);
    bubble.appendChild(deleteBtn);

    const time = document.createElement('div');
    time.className = 'message-time';
    const timestamp = msg.timestamp ? new Date(msg.timestamp) : new Date();
    time.innerHTML = `
        ${timestamp.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
        <i class="fas fa-check-double"></i>
    `;

    wrapper.appendChild(bubble);
    wrapper.appendChild(time);

    // Remove system message if exists
    const systemMsg = messagesContainer.querySelector('.system-message');
    if (systemMsg) systemMsg.remove();

    messagesContainer.appendChild(wrapper);
    updateMessageCount();
}

// ─────────────────────────────────────────────────────────────
//  📊 UPDATE MESSAGE COUNT
// ─────────────────────────────────────────────────────────────
function updateMessageCount() {
    const wrappers = messagesContainer.querySelectorAll('.message-wrapper');
    messageCount = wrappers.length;
    updateOnlineStatus();
}

// ─────────────────────────────────────────────────────────────
//  🗑️ CLEAR ALL CHAT
// ─────────────────────────────────────────────────────────────
clearChatBtn.addEventListener('click', () => {
    if (messageCount === 0) return;
    if (confirm('Delete ALL messages for everyone?')) {
        messagesRef.remove().then(() => {
            const wrappers = messagesContainer.querySelectorAll('.message-wrapper');
            wrappers.forEach(el => el.remove());
            const sysMsg = document.createElement('div');
            sysMsg.className = 'system-message';
            sysMsg.textContent = '✨ Chat cleared';
            messagesContainer.appendChild(sysMsg);
            messageCount = 0;
            updateOnlineStatus();
        });
    }
});

// ─────────────────────────────────────────────────────────────
//  🎯 ONLINE STATUS
// ─────────────────────────────────────────────────────────────
function updateOnlineStatus() {
    onlineStatus.textContent = messageCount > 0 ? `online · ${messageCount} messages` : 'online';
    onlineDot.className = 'dot';
}

// ─────────────────────────────────────────────────────────────
//  🔽 SCROLL TO BOTTOM
// ─────────────────────────────────────────────────────────────
function scrollToBottom() {
    setTimeout(() => {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }, 50);
}

messagesContainer.addEventListener('scroll', () => {
    const isAtBottom = messagesContainer.scrollHeight - messagesContainer.scrollTop - messagesContainer.clientHeight < 30;
    scrollToBottomBtn.classList.toggle('visible', !isAtBottom && messageCount > 5);
});

scrollToBottomBtn.addEventListener('click', scrollToBottom);

// ─────────────────────────────────────────────────────────────
//  🎨 EMOJI PICKER
// ─────────────────────────────────────────────────────────────
emojiBtn.addEventListener('click', () => {
    emojiPicker.classList.toggle('active');
});

emojiPicker.addEventListener('click', (e) => {
    if (e.target.tagName === 'SPAN') {
        messageInput.value += e.target.textContent;
        messageInput.focus();
        emojiPicker.classList.remove('active');
    }
});

// ─────────────────────────────────────────────────────────────
//  ⌨️ INPUT EVENTS
// ─────────────────────────────────────────────────────────────
messageInput.addEventListener('input', () => {
    const hasText = messageInput.value.trim().length > 0;
    sendBtn.disabled = !hasText;
    if (hasText) {
        setTyping(true);
    } else {
        setTyping(false);
    }
});

messageInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});

sendBtn.addEventListener('click', sendMessage);

// ─────────────────────────────────────────────────────────────
//  🚀 INIT
// ─────────────────────────────────────────────────────────────
updateOnlineStatus();
scrollToBottom();

// Remove typing indicator when tab closes
window.addEventListener('beforeunload', () => {
    typingRef.set(false);
});

console.log('💬 WhatsApp-style chat ready!');
console.log('🔗', window.location.href);
console.log('📁 Check Firebase Data tab to see messages!');
</script>

</body>
